[package]
name = "yaxus-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTPS translation server for yaxus"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tokio-stream = "0.1"
futures-util = "0.3"
tracing = "0.1"
yaxus-api = { path = "../yaxus-api" }
yaxus-tokenizer = { path = "../yaxus-tokenizer" }
yaxus-model = { path = "../yaxus-model" }
yaxus-runtime = { path = "../yaxus-runtime" }

[dev-dependencies]
yaxus-tokenizer = { path = "../yaxus-tokenizer", features = ["test-util"] }
yaxus-pfml = { path = "../yaxus-pfml" }
