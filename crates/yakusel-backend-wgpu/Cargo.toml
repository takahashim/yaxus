[package]
name = "yakusel-backend-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vulkan (wgpu) backend for yakusel with hand-written WGSL kernels"

[dependencies]
anyhow.workspace = true
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
yakusel-model = { path = "../yakusel-model" }

[dev-dependencies]
yakusel-backend-cpu = { path = "../yakusel-backend-cpu" }
serde_json.workspace = true
