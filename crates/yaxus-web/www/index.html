<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yaxus web — PLaMo 3 翻訳 (WebGPU)</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        max-width: 46rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.6;
      }
      h1 { font-size: 1.3rem; }
      input[type="file"] { margin: 1rem 0; }
      .kv { border-collapse: collapse; margin: 1rem 0; }
      .kv td, .kv th { border: 1px solid #8884; padding: 0.2rem 0.7rem; text-align: left; }
      .kv th { font-weight: 600; }
      pre { background: #8881; padding: 0.8rem; border-radius: 0.5rem; overflow-x: auto; white-space: pre-wrap; }
      #status { color: #b00; min-height: 1.5em; white-space: pre-wrap; }
      button { padding: 0.3rem 1rem; }
    </style>
  </head>
  <body>
    <h1>yaxus web — PLaMo 3 翻訳 (WebGPU 試作)</h1>
    <p>GGUF を選んでヘッダを確認し、「モデルを読み込む」でテンソルを GPU へストリーミング、
    短い文を翻訳します。</p>

    <input type="file" id="gguf" accept=".gguf" />
    <button id="go" disabled>解析</button>
    <button id="load" disabled>モデルを読み込む</button>
    <button id="diag">診断</button>
    <button id="probe" disabled>probe</button>
    <div id="status"></div>
    <pre id="diag-out" hidden></pre>

    <table id="info" class="kv" hidden>
      <tbody>
        <tr><th>ファイル</th><td id="f-name"></td></tr>
        <tr><th>モデル</th><td id="f-model"></td></tr>
        <tr><th>arch / 量子化</th><td id="f-quant"></td></tr>
        <tr><th>サイズ</th><td id="f-size"></td></tr>
        <tr><th>テンソル</th><td id="f-tensors"></td></tr>
        <tr><th>語彙</th><td id="f-vocab"></td></tr>
      </tbody>
    </table>
    <pre id="config" hidden></pre>
    <pre id="tensors" hidden></pre>

    <div id="tr-area" hidden>
      <p>
        翻訳先: <select id="to">
          <option value="en" selected>英語 (en)</option>
          <option value="ja">日本語 (ja)</option>
        </select>
        翻訳元: <select id="from">
          <option value="" selected>(自動検出)</option>
          <option value="ja">日本語 (ja)</option>
          <option value="en">英語 (en)</option>
        </select>
      </p>
      <textarea id="src" rows="3" style="width:100%">こんにちは。今日はとても良い天気ですね。</textarea>
      <button id="tr">翻訳</button>
      <pre id="dst"></pre>
    </div>

    <script type="module">
      import init, { summarize, load_model, hook_panics, run_diag } from "./pkg/yaxus_web.js";

      const $ = (id) => document.getElementById(id);
      const status = $("status");
      const log = (m) => { status.textContent = m; };
      let file = null;

      init()
        .then(() => { hook_panics(); })
        .catch((e) => {
        status.textContent = `wasm の初期化に失敗: ${e}`;
      });

      $("gguf").addEventListener("change", (ev) => {
        file = ev.target.files[0] ?? null;
        $("go").disabled = !file;
        $("load").disabled = !file;
        status.textContent = "";
      });

      $("go").addEventListener("click", async () => {
        if (!file) return;
        $("info").hidden = true;
        $("config").hidden = true;
        $("tensors").hidden = true;
        log("解析中…");
        try {
          const s = await summarize(file);
          $("f-name").textContent = file.name;
          $("f-model").textContent = s.name;
          $("f-quant").textContent = `${s.arch} / ${s.quant}`;
          $("f-size").textContent = `${(Number(s.file_bytes) / 1e6).toFixed(1)} MB (テンソル合計 ${(Number(s.tensor_bytes) / 1e6).toFixed(1)} MB)`;
          $("f-tensors").textContent = `${s.tensors}`;
          $("f-vocab").textContent = `${s.vocab_size} トークン`;
          $("config").textContent = s.config;
          $("tensors").textContent = s.tensors_preview;
          $("info").hidden = false;
          $("config").hidden = false;
          $("tensors").hidden = false;
          log("");
        } catch (e) {
          log(`エラー: ${e}`);
        }
      });

      let tr = null;
      $("load").addEventListener("click", async () => {
        if (!file || tr) return;
        $("load").disabled = true;
        log("モデルを読み込み中… (ヘッダ → テンソルを 1 つずつ GPU へ)");
        const t0 = performance.now();
        try {
          tr = await load_model(file, 4096, false);
          log(`読み込み完了 (${((performance.now() - t0) / 1000).toFixed(1)} 秒)`);
          $("tr-area").hidden = false;
          $("probe").disabled = false;
        } catch (e) {
          log(`読み込みエラー: ${e}`);
          $("load").disabled = false;
        }
      });

      $("tr").addEventListener("click", async () => {
        if (!tr) return;
        $("tr").disabled = true;
        $("dst").textContent = "";
        log("翻訳中…");
        const t0 = performance.now();
        try {
          const from = $("from").value || null;
          const out = await tr.translate($("src").value, $("to").value, from, 256);
          $("dst").textContent = out;
          log(`翻訳完了 (${((performance.now() - t0) / 1000).toFixed(1)} 秒)`);
        } catch (e) {
          log(`翻訳エラー: ${e}`);
        }
        $("tr").disabled = false;
      });

      $("probe").addEventListener("click", async () => {
        if (!tr) return;
        try {
          $("diag-out").textContent = await tr.trace2($("src").value, $("to").value);
          $("diag-out").hidden = false;
          log("");
        } catch (e) {
          log(`trace エラー: ${e}`);
        }
      });

      $("diag").addEventListener("click", async () => {
        log("診断中…");
        try {
          const out = await run_diag();
          $("diag-out").textContent = out;
          $("diag-out").hidden = false;
          log("");
        } catch (e) {
          log(`診断エラー: ${e}`);
        }
      });
    </script>
  </body>
</html>
