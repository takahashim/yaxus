[package]
name = "yakusel-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTPS translation server for yakusel"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tokio-stream = "0.1"
futures-util = "0.3"
tracing = "0.1"
yakusel-api = { path = "../yakusel-api" }
yakusel-tokenizer = { path = "../yakusel-tokenizer" }
yakusel-model = { path = "../yakusel-model" }
yakusel-backend-cpu = { path = "../yakusel-backend-cpu" }
yakusel-backend-wgpu = { path = "../yakusel-backend-wgpu" }
