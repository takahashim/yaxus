[package]
name = "yaxus-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Translation jobs on a loaded engine for yaxus: requests, documents, translation memory, the inference loop (shared by the server, the CLI and the browser)"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing = "0.1"
web-time = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
yaxus-api = { path = "../yaxus-api" }
yaxus-tokenizer = { path = "../yaxus-tokenizer" }
yaxus-pfml = { path = "../yaxus-pfml" }
yaxus-model = { path = "../yaxus-model" }

[dev-dependencies]
yaxus-tokenizer = { path = "../yaxus-tokenizer", features = ["test-util"] }
