[package]
name = "yaxus-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model resolution, loading and translation jobs for yaxus (shared by the server and local mode)"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing = "0.1"
web-time = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
yaxus-api = { path = "../yaxus-api" }
yaxus-tokenizer = { path = "../yaxus-tokenizer" }
yaxus-pfml = { path = "../yaxus-pfml" }
yaxus-model = { path = "../yaxus-model" }
yaxus-backend-cpu = { path = "../yaxus-backend-cpu" }
yaxus-backend-gpu = { path = "../yaxus-backend-gpu" }

[dev-dependencies]
yaxus-tokenizer = { path = "../yaxus-tokenizer", features = ["test-util"] }
serde_json.workspace = true
