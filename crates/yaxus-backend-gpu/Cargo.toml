[package]
name = "yaxus-backend-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU backend for yaxus (wgpu on Vulkan or Metal, or Metal directly) with hand-written WGSL and MSL kernels"

[dependencies]
anyhow.workspace = true
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
web-time = "1"
yaxus-model = { path = "../yaxus-model" }

# The platform's GPU API (see `device::platform_backends`).
[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu"] }
futures-channel = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }
# Metal without wgpu (`dev::metal`): the bindings wgpu-hal uses, and naga to translate
# the WGSL kernels to MSL.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
naga = { version = "30", default-features = false, features = ["wgsl-in", "msl-out"] }

[features]
# Single ops on given data for the integration tests (`debug_*`).
test-hooks = []

[dev-dependencies]
yaxus-backend-gpu = { path = ".", features = ["test-hooks"] }
yaxus-backend-cpu = { path = "../yaxus-backend-cpu" }
serde_json.workspace = true
# Parses the WebGPU (wasm) variant of the kernels without a browser.
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
