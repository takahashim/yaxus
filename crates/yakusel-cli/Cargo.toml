[package]
name = "yakusel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "yakusel command-line interface"

[[bin]]
name = "yakusel"
path = "src/main.rs"

[features]
default = ["server"]
# `serve` and `translate` (local inference). Build with --no-default-features for a client-only binary.
server = ["dep:yakusel-server", "dep:yakusel-model", "dep:yakusel-tokenizer", "dep:tracing-subscriber"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
yakusel-api = { path = "../yakusel-api" }
yakusel-tokenizer = { path = "../yakusel-tokenizer", optional = true }
yakusel-model = { path = "../yakusel-model", optional = true }
yakusel-server = { path = "../yakusel-server", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
