[package]
name = "yaxus-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser (wasm32 + WebGPU) front end for yaxus translation"

[lib]
crate-type = ["cdylib"]

# The crate is wasm-only: on native it builds as an empty library so that the
# workspace's tests and clippy still cover the other crates.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow.workspace = true
console_error_panic_hook = "0.1"
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-time = "1"
yaxus-api = { path = "../yaxus-api" }
yaxus-backend-gpu = { path = "../yaxus-backend-gpu" }
yaxus-model = { path = "../yaxus-model" }
yaxus-pfml = { path = "../yaxus-pfml" }
yaxus-runtime = { path = "../yaxus-runtime" }
yaxus-tokenizer = { path = "../yaxus-tokenizer" }
