name: Generate 0.8B golden (temporary)

# One-off: generates tests/golden/logits_0_8b.jsonl with HF transformers and reports
# the revisions it used. Removed again once the file is committed.

on:
  push:
    branches: [ci-model-0.8b]
    paths: [.github/workflows/gen-golden.yml]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisions and files
        run: |
          for repo in pfnet/plamo-3-translate-0.8b pfnet/plamo-3-translate-0.8b-GGUF; do
            curl -fsSL "https://huggingface.co/api/models/$repo/revision/main" \
              | jq -r --arg r "$repo" '"REVISION \($r) \(.sha)", (.siblings[].rfilename | "  \(.)")'
          done
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers numba numpy safetensors huggingface_hub
          pip list | grep -Ei '^(torch|transformers|numba|numpy|huggingface)'
      - name: Download the model
        run: |
          dir=$(hf download pfnet/plamo-3-translate-0.8b --quiet)
          echo "MODEL_DIR=$dir" >> "$GITHUB_ENV"
          echo "snapshot: $dir"
          ls -la "$dir"
      - name: Generate
        run: |
          python tests/golden/gen_logits.py "$MODEL_DIR" > logits_0_8b.jsonl
          echo "----- BEGIN logits_0_8b.jsonl -----"
          cat logits_0_8b.jsonl
          echo "----- END logits_0_8b.jsonl -----"
          sha256sum logits_0_8b.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: logits_0_8b
          path: logits_0_8b.jsonl
