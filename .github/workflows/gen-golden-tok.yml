name: Regenerate tokenizer golden (temporary)

# One-off: runs tests/golden/gen_tokenizer.py with the reference tokenizer at the
# revision CI pins and prints how its output differs from the committed file.

on:
  push:
    branches: [tokenizer-review2]
    paths: [.github/workflows/gen-golden-tok.yml]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers numba numpy huggingface_hub
          pip list | grep -Ei '^(torch|transformers|numba|numpy)'
      - name: Download the tokenizer
        run: |
          dir=$(hf download pfnet/plamo-3-translate-2b tokenizer.jsonl tokenizer_config.json \
            tokenization_plamo.py chat_template.jinja special_tokens_map.json config.json \
            --revision cf66d22fbe6202c56b8e5d283691aa1da53d05af --quiet)
          # One file prints its path, several the snapshot directory.
          [ -f "$dir" ] && dir=$(dirname "$dir")
          echo "MODEL_DIR=$dir" >> "$GITHUB_ENV"
          ls -la "$dir"
      - name: Generate and compare
        run: |
          cd tests/golden
          python gen_tokenizer.py "$MODEL_DIR" > /tmp/tokenizer.jsonl
          wc -l tokenizer.jsonl /tmp/tokenizer.jsonl
          echo "----- BEGIN diff -----"
          diff tokenizer.jsonl /tmp/tokenizer.jsonl || true
          echo "----- END diff -----"
          sha256sum /tmp/tokenizer.jsonl
