name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Replaces `target-cpu=native` from .cargo/config.toml (cached builds must run on any
  # runner) and turns warnings, clippy's included, into errors.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    env:
      # The tokenizer golden tests need the model's tokenizer.jsonl (public, 3.5 MB),
      # pinned to the revision tests/golden was made with.
      TOKENIZER_URL: https://huggingface.co/pfnet/plamo-3-translate-2b/resolve/cf66d22fbe6202c56b8e5d283691aa1da53d05af/tokenizer.jsonl
      TOKENIZER_SHA256: bdce9e430e65931b28c56de2054f52b4cf8ed59b322db125e016d724d06dbb0e
      YAXUS_MODEL_DIR: ${{ github.workspace }}/.model
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: CLI without the server, and client only
        run: |
          cargo clippy -p yaxus-cli --no-default-features --features local
          cargo clippy -p yaxus-cli --no-default-features
      - name: Browser (wasm32 + WebGPU)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p yaxus-browser --target wasm32-unknown-unknown
      - name: Tokenizer for the golden tests
        uses: actions/cache@v6
        with:
          path: .model
          key: tokenizer-cf66d22f
      - run: |
          if [ ! -f .model/tokenizer.jsonl ]; then
            mkdir -p .model
            curl -fsSL "$TOKENIZER_URL" -o .model/tokenizer.jsonl
          fi
          echo "$TOKENIZER_SHA256  .model/tokenizer.jsonl" | sha256sum -c -
      - name: Tests
        env:
          # Fail instead of skipping if the tokenizer above is somehow missing.
          YAXUS_REQUIRE_GOLDEN: "1"
        run: cargo test --workspace

  kernels:
    # The GPU kernels against host references, on lavapipe (Mesa's software Vulkan).
    # Its subgroups are narrower than 32 lanes, so this covers the prefill GEMMs (f32 and
    # integer) and the f32 decode kernels, not the integer decode ones.
    name: GPU kernels (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Kernel tests
        env:
          YAXUS_SOFTWARE_GPU: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: cargo test --release -p yaxus-backend-gpu --test kernels -- --ignored

  metal:
    # The kernel tests on Metal (the macOS runners' GPU is a virtual Apple GPU), through
    # wgpu and without it (YAXUS_DEVICE=metal) side by side; with the first, clippy over the
    # macOS-only paths and the macOS-only unit tests (the WGSL-to-MSL translation).
    name: GPU kernels (Metal, ${{ matrix.device }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [wgpu, metal]
    env:
      YAXUS_DEVICE: ${{ matrix.device == 'metal' && 'metal' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Metal's compiled shaders, kept from run to run. Through wgpu the cache takes about a
      # quarter off the kernel tests (295 s without it, 221 s with it); with
      # YAXUS_DEVICE=metal, little (306 s, 301 s). The cache's directory may differ between
      # runners, so it is copied to and from a fixed one. The key holds what the compiled
      # shaders depend on besides the sources (the device, whose kernels are translated
      # differently; macOS's Metal compiler, by the OS build, which not every image update
      # changes; the toolchain that names the test binaries; naga's translation in
      # Cargo.lock): an exact hit is not saved again, so a change there would otherwise
      # leave every run cold.
      - name: Shader cache directory
        id: shaders
        run: |
          echo "dir=$(getconf DARWIN_USER_CACHE_DIR)com.apple.metal" >> "$GITHUB_OUTPUT"
          echo "prefix=metal-shaders-${{ runner.os }}-${{ matrix.device }}-$(sw_vers -buildVersion)-${{ steps.toolchain.outputs.cachekey }}-" >> "$GITHUB_OUTPUT"
      - name: Restore the shader cache
        id: restore-shaders
        uses: actions/cache/restore@v6
        with:
          path: ~/metal-shaders
          key: ${{ steps.shaders.outputs.prefix }}${{ hashFiles('Cargo.lock', 'crates/yaxus-backend-gpu/src/**') }}
          restore-keys: ${{ steps.shaders.outputs.prefix }}
      - name: Use the restored shader cache
        run: |
          if [ -d ~/metal-shaders ]; then
            mkdir -p "${{ steps.shaders.outputs.dir }}"
            cp -R ~/metal-shaders/. "${{ steps.shaders.outputs.dir }}/"
          fi
      - name: Clippy
        if: matrix.device == 'wgpu'
        run: cargo clippy -p yaxus-backend-gpu --all-targets
      - name: Device
        env:
          YAXUS_EXPECT_SUBGROUPS: "1"
        run: cargo test --release -p yaxus-backend-gpu --test kernels -- --ignored --nocapture reports_the_device
      - name: Kernel tests
        run: cargo test --release -p yaxus-backend-gpu --test kernels -- --ignored
      - name: Unit tests
        if: matrix.device == 'wgpu'
        run: cargo test --release -p yaxus-backend-gpu --lib
      - name: Take the shader cache
        if: always() && steps.restore-shaders.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/metal-shaders
          if [ -d "${{ steps.shaders.outputs.dir }}" ]; then cp -R "${{ steps.shaders.outputs.dir }}" ~/metal-shaders; fi
      - name: Save the shader cache
        if: always() && steps.restore-shaders.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/metal-shaders
          key: ${{ steps.restore-shaders.outputs.cache-primary-key }}
